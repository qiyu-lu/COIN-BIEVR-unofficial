topics:
  pointcloud: "/livox/lidar"
  imu: "/livox/imu"

calibration: # T_IMU_LIDAR (LiDAR -> IMU)
  translation: [0.04165, 0.02326, -0.0284]
  rotation: [1, 0, 0,
             0, 1, 0,
             0, 0, 1]

lidar:
  min_range_m: 1.5 # Exclude points closer than this range [m]
  max_range_m: 450 # Exclude points farther than this range [m]

map:
  max_size: 600000 # Maximum number of voxels to keep in the map

intensity: # Livox Avia (non-repetitive scan pattern, 70.4 x 77.2 deg field of view)
  image_width: 900 # Horizontal resolution of the intensity image (360 deg)
  image_height: 200 # Vertical resolution of the intensity image
  fov_up_deg: 40 # Elevation of the upper image border [deg]
  fov_down_deg: -40 # Elevation of the lower image border [deg]
  scale: 1.0 # Scale applied to the raw reflectivity
  window: [37, 13] # Brightness normalization window [px] (width, height)
